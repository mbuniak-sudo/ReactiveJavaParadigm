management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: info, health, metrics
  endpoint:
    health:
      show-details: always
      enabled: true
    metrics:
      enabled: true
logging:
  level:
    root: INFO
spring:
  data:
    mongodb:
      uri: mongodb://root:pwd@localhost:27017/reactive_paradigm?authSource=admin